  # Canadian Incumbents (big-6 banks)
  #
  # These are tier=incumbent and surface only through dedicated views; the
  # analyzer cost gate skips Pro analysis on bank jobs outside the staff+
  # AI/ML/Data/Risk whitelist (see web/lib/jobs/incumbent-cost-gate.ts).
  # is_active defaults to false until Phase 1.5 validates the scraper end-
  # to-end against the live site.
  - name: RBC
    slug: rbc
    country: CA
    ats_type: phenom
    ats_identifier: rbc
    careers_url: https://jobs.rbc.com/ca/en/search-results
    tier: incumbent
    is_active: false

  # Phase 3 additions — each ships is_active=false; flip after the first
  # smoke + 24h of clean job_runs entries. The 4 banks together roughly 5×
  # the active job_postings volume; see the perf indexes migration
  # 20260522000000_phase3_indexes.sql and the scraper-break canary.
  - name: BMO
    slug: bmo
    country: CA
    ats_type: phenom
    ats_identifier: bmo
    careers_url: https://jobs.bmo.com/ca/en/search-results
    tier: incumbent
    is_active: false

  - name: TD
    slug: td
    country: CA
    ats_type: workday-td
    ats_identifier: td
    careers_url: https://td.wd3.myworkdayjobs.com/en-US/TD_Bank_Careers
    tier: incumbent
    is_active: false

  - name: CIBC
    slug: cibc
    country: CA
    ats_type: workday-cibc
    ats_identifier: cibc
    careers_url: https://cibc.wd3.myworkdayjobs.com/search
    tier: incumbent
    is_active: false

  - name: Simplii Financial
    slug: simplii
    country: CA
    # Simplii shares CIBC's Workday tenant — no own listing endpoint.
    # In the DB this row has parent_company_id=<cibc.id>, which causes
    # the collect cron to skip it. Its jobs land via CIBC's scrape with
    # `companySlugOverride: 'simplii'` set by the `isSimpliiPosting`
    # classifier in workday-cibc.ts. ats_type/identifier mirror CIBC for
    # parity but aren't used at runtime.
    ats_type: workday-cibc
    ats_identifier: cibc
    careers_url: https://www.simplii.com
    tier: fintech
    is_active: false

  - name: National Bank
    slug: bnc
    country: CA
    ats_type: avature
    ats_identifier: bnc
    careers_url: https://emplois.bnc.ca/en_CA/careers/searchjobs
    tier: incumbent
    is_active: false

  # Scotiabank (parent brand). Shares jobs.scotiabank.com with Tangerine but
  # under a different brand path. The same `scotiabank.ts` SuccessFactors
  # scraper handles both — Tangerine's hrefs include the `/Tangerine/` brand
  # prefix, Scotia parent omits it, so the parser matches both shapes.
  - name: Scotiabank
    slug: scotiabank
    country: CA
    ats_type: scotiabank
    ats_identifier: Scotiabank
    careers_url: https://jobs.scotiabank.com/Scotiabank/search/
    tier: incumbent
    is_active: false
