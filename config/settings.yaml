database:
  path: data/jobs.db

analysis:
  provider: gemini
  model: gemini-flash-latest  # Always use the `-latest` alias; do not pin versioned or preview IDs
  temperature: 0.3
  max_tokens: 65536

email:
  enabled: true
  # SMTP settings loaded from environment variables

reports:
  weekly_day: monday
  include_international: false

logging:
  level: INFO
  file: logs/fintech_talent_brief.log

schedule:
  collection_time: "06:00"
  weekly_report_time: "08:00"
  weekly_report_day: monday
