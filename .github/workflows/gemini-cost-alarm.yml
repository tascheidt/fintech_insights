name: Gemini Cost Alarm

# Daily check against `gemini_usage_events`. Calls /api/admin/cost-alarm,
# which sums the last 24h of `estimated_usd` and fires Sentry.captureMessage
# when over the threshold. Threshold lives in the GEMINI_DAILY_USD_THRESHOLD
# env var (default $50; see web/app/api/admin/cost-alarm/route.ts).
#
# Why this lives here, not on Vercel:
#   The Hobby plan caps Vercel cron jobs at 2 (collect + report). This runs
#   from GitHub Actions for the same reason as company-insights-cron.yml.
#   See docs/CRON_TOPOLOGY.md.
#
# Required repository secrets:
#   - APP_HOST     hostname only, no scheme (e.g. fintech-talent-brief.vercel.app)
#   - CRON_SECRET  same value as the Vercel env var of the same name

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC daily — six hours after the daily collect run
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate required secrets
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_HOST" ]; then
            echo "::error::Missing required secret APP_HOST"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing required secret CRON_SECRET"
            exit 1
          fi

      - name: Trigger /api/admin/cost-alarm
        env:
          APP_HOST: ${{ secrets.APP_HOST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          URL="https://${APP_HOST}/api/admin/cost-alarm"
          echo "GET ${URL}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/response.json \
            --write-out "%{http_code}" \
            --max-time 60 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "User-Agent: github-actions-cron/gemini-cost-alarm" \
            "${URL}")

          echo "HTTP ${HTTP_STATUS}"
          echo "--- response body ---"
          cat /tmp/response.json || true
          echo
          echo "---------------------"

          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Non-2xx response from /api/admin/cost-alarm (HTTP ${HTTP_STATUS})"
            exit 1
          fi
