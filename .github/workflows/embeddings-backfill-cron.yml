name: Job Embeddings Backfill Cron

# Daily sweep that embeds newly-ingested (and stale-model) job postings into
# job_postings.embedding for the Jobs semantic-search feature. Runs the
# backfill-job-embeddings.ts script directly in the Action runner so embedding
# work stays OFF the ingest hot path (and off the Vercel cron quota, cap is 2).
# The script is idempotent: rows already embedded with the current model + dims
# are skipped, so re-running only touches new or stale rows.
#
# Required repository secrets:
#   - GEMINI_API_KEY
#   - NEXT_PUBLIC_SUPABASE_URL
#   - SUPABASE_SERVICE_ROLE_KEY
#
# Schedule: 07:30 UTC daily — deliberately offset from the existing crons
# (collect 06:00, report Mon 05:00, company-insights Mon 09:00, editorial
# Mon 11:00, gemini-cost-alarm 14:00) so embedding load doesn't stack on them.

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Validate required secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for secret in GEMINI_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            value=$(eval echo \$$secret)
            if [ -z "$value" ]; then
              echo "::error::Missing required secret $secret"
              exit 1
            fi
          done

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Run job-embeddings backfill sweep
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/backfill-job-embeddings.ts
