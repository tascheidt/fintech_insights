name: Auto-Implement Feedback Issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'GitHub Issue number to implement'
        required: true
        type: string

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GJ_GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch issue details
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GJ_GITHUB_TOKEN }}
        run: |
          ISSUE_JSON=$(gh api repos/${{ github.repository }}/issues/${{ inputs.issue_number }})
          TITLE=$(echo "$ISSUE_JSON" | jq -r '.title')
          BODY=$(echo "$ISSUE_JSON" | jq -r '.body')

          echo "title=$TITLE" >> $GITHUB_OUTPUT

          # Write body to file to avoid env var length limits
          echo "$BODY" > /tmp/issue_body.txt

          # Create URL-safe slug from title (max 40 chars)
          SLUG=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-40)
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      - name: Create feature branch
        run: |
          BRANCH="feedback/${{ inputs.issue_number }}-${{ steps.issue.outputs.slug }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Run Claude Code agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ISSUE_BODY=$(cat /tmp/issue_body.txt)

          claude -p "You are implementing a GitHub Issue for The Fintech Talent Brief — a Next.js 16 / Supabase fintech hiring intelligence platform.

          ## Your Task
          Implement the following issue exactly as specified:

          **Issue #${{ inputs.issue_number }}: ${{ steps.issue.outputs.title }}**

          $ISSUE_BODY

          ## Rules
          - Work exclusively inside the \`web/\` directory. Do NOT touch \`src/\`, \`scripts/\`, \`.github/\`, \`CLAUDE.md\`, \`vercel.json\`, or any \`.env\` files.
          - Do NOT modify migration files or create new Supabase migrations — schema changes must be done manually.
          - Follow the existing code patterns and Notion-style aesthetic (clean white/off-white, high contrast typography).
          - After making all changes, run: \`cd web && npm run build\` to verify the build passes. Fix any TypeScript errors before finishing.
          - Keep changes minimal and focused — only implement what the issue describes." \
            --model claude-sonnet-4-6 \
            --dangerously-skip-permissions \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Validate build
        working-directory: web
        run: npm run build

      - name: Commit changes
        run: |
          git add web/
          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "feat: auto-implement issue #${{ inputs.issue_number }} — ${{ steps.issue.outputs.title }}

          Co-authored-by: Claude Sonnet 4.6 <noreply@anthropic.com>"

      - name: Push branch
        run: git push origin "$BRANCH"

      - name: Create draft pull request
        env:
          GH_TOKEN: ${{ secrets.GJ_GITHUB_TOKEN }}
        run: |
          gh pr create \
            --draft \
            --title "AI: ${{ steps.issue.outputs.title }}" \
            --body "## Auto-generated implementation

          This PR was generated by Claude Code (claude-sonnet-4-6) in response to feedback issue #${{ inputs.issue_number }}.

          **Linked issue:** #${{ inputs.issue_number }}

          ---

          ### Review checklist
          - [ ] Code follows existing patterns and Notion-style aesthetic
          - [ ] TypeScript types are correct (build passes)
          - [ ] No unintended files were modified
          - [ ] RLS policies are not bypassed
          - [ ] Changes match the issue specification

          > **Note:** This is AI-generated code. Review carefully before marking ready." \
            --label "auto-generated" \
            --head "$BRANCH"
