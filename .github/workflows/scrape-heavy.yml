name: Heavy Scraper

on:
  workflow_dispatch:
    inputs:
      company_id:
        description: 'Company ID (UUID) to scrape'
        required: true
        type: string
      task_id:
        description: 'Task ID (UUID) to update (optional, creates new task if not provided)'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    # TD is the largest corpus at ~1,600 jobs; with the workday-td
    # concurrent enrichment path (50/batch, concurrency=4) full runs land
    # well under 10 min. 30 min is a hard ceiling so a hung scrape fails
    # the workflow cleanly instead of holding the task in 'running'.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run heavy scraper
        working-directory: web
        env:
          COMPANY_ID: ${{ inputs.company_id }}
          TASK_ID: ${{ inputs.task_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/scrape-heavy.ts
