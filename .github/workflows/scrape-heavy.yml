name: Heavy Scraper

on:
  workflow_dispatch:
    inputs:
      company_id:
        description: 'Company ID (UUID) to scrape'
        required: true
        type: string
      task_id:
        description: 'Task ID (UUID) to update (optional, creates new task if not provided)'
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    # RBC (Phenom) is the long-pole corpus: ~1,400 jobs enriched via a
    # Puppeteer page-load per detail page (HTTP-based Workday tenants like TD
    # finish in <10 min). After the June 2026 navigation speed-up it lands in
    # ~12-15 min, but it's the run that actually exercises this ceiling, so 45
    # min gives genuine headroom while still failing a hung scrape cleanly
    # instead of holding the task in 'running'. (A 30-min cap silently killed
    # every RBC run for a week — it strangled enrichment mid-corpus.)
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run heavy scraper
        working-directory: web
        env:
          COMPANY_ID: ${{ inputs.company_id }}
          TASK_ID: ${{ inputs.task_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/scrape-heavy.ts

  # Fresh-runner retry. Workday tenants (CIBC, TD) sit behind Akamai, which
  # intermittently greylists GitHub Actions runner egress IPs and answers the
  # cold listing POST with a 200 + HTML challenge page — the scrape then fails
  # before fetching anything (June 2026 CIBC/TD incident). The block is
  # per-runner-IP and clears on a new runner: a manual re-trigger landed the
  # full CIBC (511) + TD (1,437) corpus minutes after the morning failure.
  # This job re-runs the scrape ONCE on a fresh runner (hence a fresh egress
  # IP) when the first attempt fails. Because the dispatcher passes a stable
  # task_id (web/lib/github.ts), the retry updates the SAME job_run_tasks row
  # rather than forking a second one. Retrying on any failure — not just the
  # Akamai block — is intentional: it is cheap and the block is the dominant
  # failure mode. A second consecutive greylist is rare; the daily cron is the
  # backstop.
  scrape-retry:
    needs: scrape
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Brief settle before re-hitting the origin. The retry exists for two
      # failure modes: an Akamai IP greylist (a fresh runner IP is the fix, so a
      # delay is harmless) AND a Supabase origin outage (the June 18 2026
      # incident — Cloudflare 522s at the ingest write). For the latter the
      # primary scrape and this retry fired ~1 min apart and BOTH hit the still
      # down DB, wasting the retry at its first read. A short wait lets a brief
      # origin blip clear before the retry's reads (which now also ride out
      # transient outages in scrape-heavy.ts). Cheap relative to the ~40 min
      # re-scrape it precedes.
      - name: Settle before retry (let a transient origin blip clear)
        run: sleep 90

      - name: Run heavy scraper (fresh-runner retry)
        working-directory: web
        env:
          COMPANY_ID: ${{ inputs.company_id }}
          TASK_ID: ${{ inputs.task_id }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/scrape-heavy.ts
