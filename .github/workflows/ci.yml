name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  lint-typecheck-test-build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Lint has known nags pre-launch; surface them but don't block merges.
        # Tighten this once Stream B's lint pass lands.
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build requires the env validator (web/lib/env.ts) to pass — see
          # web/instrumentation.ts. Use minimum-viable real-looking values
          # so the Zod schema accepts them. These are not real secrets.
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          GEMINI_API_KEY: ci-gemini-key
          CRON_SECRET: ci-cron-secret
          RESEND_API_KEY: ci-resend-key

      - name: Migration filename convention check
        # Pragmatic substitute for `supabase db diff` (which would need a
        # configured Supabase project). Two non-blocking checks:
        #   1. New migrations follow the timestamped-filename regex.
        #   2. New migrations include a `# Description:` line in their header.
        # Same posture as the doc-drift check — warn, don't block.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin "$BASE_SHA" || true
          git fetch --no-tags --depth=200 origin "$HEAD_SHA" || true
          CHANGED=$(git diff --name-only --diff-filter=A "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^web/supabase/migrations/.+\.sql$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No new migrations in this PR."
            exit 0
          fi
          FAILED=0
          echo "$CHANGED" | while read -r f; do
            base=$(basename "$f")
            if ! echo "$base" | grep -qE '^[0-9]{14}_.+\.sql$'; then
              echo "::warning file=$f::Migration filename does not match timestamped convention (^[0-9]{14}_.+\\.sql$)"
              FAILED=1
            fi
            if ! head -10 "$f" | grep -qiE '^(--|#).*Description:'; then
              echo "::warning file=$f::Migration is missing a '-- Description:' header line"
            fi
          done
          exit 0

  e2e-smoke:
    name: Playwright e2e (public routes)
    needs: lint-typecheck-test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          GEMINI_API_KEY: ci-gemini-key
          CRON_SECRET: ci-cron-secret
          RESEND_API_KEY: ci-resend-key

      - name: Start app
        run: |
          npm start &
          echo $! > /tmp/app.pid
          # Wait for the dev server to bind port 3000.
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start within 60s." >&2
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          GEMINI_API_KEY: ci-gemini-key
          CRON_SECRET: ci-cron-secret
          RESEND_API_KEY: ci-resend-key
          PORT: "3000"

      - name: Run public smoke + visual specs
        # The chromium-public project covers both `e2e/smoke.spec.ts` and the
        # public assertions inside `e2e/visual-smoke.spec.ts` (login,
        # marketing). Authenticated routes are skipped by the spec when the
        # `chromium-authed` project is not selected — see
        # `web/e2e/visual-smoke.spec.ts`.
        run: npx playwright test --project=chromium-public

      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/app.pid ]; then
            kill "$(cat /tmp/app.pid)" || true
          fi

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  e2e-authed:
    # Authenticated visual smoke. Requires real Supabase + service-role
    # credentials to mint a Playwright session via the `setup` project. We
    # only run on the canonical refs (PR target main, push to main) and
    # skip cleanly if the secrets are absent so forks don't break.
    name: Playwright e2e (authed routes)
    needs: lint-typecheck-test-build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      # Check out FIRST so the job's `defaults.run.working-directory: web`
      # has a `web/` directory to enter. The previous ordering (gate
      # first) failed because every step inherits the working-directory
      # default — including the gate step before checkout had created
      # `web/`. Cost of always checking out is ~1s; gate still skips
      # everything else when secrets are absent.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Skip when Supabase secrets are absent
        id: gate
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::warning::Skipping authed e2e — Supabase secrets not configured for this runner (need URL, anon key, and service-role key)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Build the app
        if: steps.gate.outputs.skip != 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-gemini-key' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'ci-cron-secret' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'ci-resend-key' }}

      - name: Start app
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm start &
          echo $! > /tmp/app.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then
              echo "App is up."
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start within 60s." >&2
          exit 1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-gemini-key' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'ci-cron-secret' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'ci-resend-key' }}
          PORT: "3000"

      - name: Run authed visual smoke
        if: steps.gate.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx playwright test --project=setup --project=chromium-authed

      - name: Stop app
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          if [ -f /tmp/app.pid ]; then
            kill "$(cat /tmp/app.pid)" || true
          fi

      - name: Upload Playwright artifacts
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authed
          path: web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
